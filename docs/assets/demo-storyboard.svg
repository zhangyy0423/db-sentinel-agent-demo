<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Three-minute demo storyboard</title>
  <desc id="desc">A three-minute presentation storyboard: problem, first query, anomaly insight, safety block, and closing value.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="60" y="76" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="850">3 分钟演示故事线</text>
  <text x="62" y="114" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="19">按这个顺序讲，评审能快速看到业务价值、Agent 闭环和安全边界。</text>

  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(58 190)">
      <rect width="214" height="340" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="20" y="24" width="76" height="36" rx="18" fill="#0f172a"/>
      <text x="40" y="48" fill="#ffffff" font-size="16" font-weight="850">0:00</text>
      <text x="24" y="98" fill="#0f172a" font-size="23" font-weight="850">问题痛点</text>
      <text x="24" y="138" fill="#475569" font-size="15">业务想问数</text>
      <text x="24" y="166" fill="#475569" font-size="15">分析师写 SQL</text>
      <text x="24" y="194" fill="#475569" font-size="15">口径散落聊天</text>
      <rect x="24" y="244" width="166" height="54" rx="14" fill="#fee2e2"/>
      <text x="42" y="277" fill="#b91c1c" font-size="16" font-weight="800">慢 + 难复核</text>
    </g>

    <g transform="translate(306 190)">
      <rect width="214" height="340" rx="24" fill="#ffffff" stroke="#99f6e4"/>
      <rect x="20" y="24" width="76" height="36" rx="18" fill="#0f766e"/>
      <text x="40" y="48" fill="#ffffff" font-size="16" font-weight="850">0:30</text>
      <text x="24" y="98" fill="#0f172a" font-size="23" font-weight="850">GMV 问数</text>
      <text x="24" y="138" fill="#475569" font-size="15">点击样例问题</text>
      <text x="24" y="166" fill="#475569" font-size="15">展示 SQL</text>
      <text x="24" y="194" fill="#475569" font-size="15">表格 + 图表</text>
      <rect x="24" y="244" width="166" height="54" rx="14" fill="#ccfbf1"/>
      <text x="40" y="277" fill="#0f766e" font-size="16" font-weight="800">能自助查数</text>
    </g>

    <g transform="translate(554 190)">
      <rect width="214" height="340" rx="24" fill="#ffffff" stroke="#bfdbfe"/>
      <rect x="20" y="24" width="76" height="36" rx="18" fill="#2563eb"/>
      <text x="40" y="48" fill="#ffffff" font-size="16" font-weight="850">1:20</text>
      <text x="24" y="98" fill="#0f172a" font-size="23" font-weight="850">异常洞察</text>
      <text x="24" y="138" fill="#475569" font-size="15">对比两周窗口</text>
      <text x="24" y="166" fill="#475569" font-size="15">定位下降渠道</text>
      <text x="24" y="194" fill="#475569" font-size="15">给可能原因</text>
      <rect x="24" y="244" width="166" height="54" rx="14" fill="#dbeafe"/>
      <text x="42" y="277" fill="#1d4ed8" font-size="16" font-weight="800">能解释原因</text>
    </g>

    <g transform="translate(802 190)">
      <rect width="214" height="340" rx="24" fill="#ffffff" stroke="#fed7aa"/>
      <rect x="20" y="24" width="76" height="36" rx="18" fill="#ea580c"/>
      <text x="40" y="48" fill="#ffffff" font-size="16" font-weight="850">2:10</text>
      <text x="24" y="98" fill="#0f172a" font-size="23" font-weight="850">活动复盘</text>
      <text x="24" y="138" fill="#475569" font-size="15">618 ROI</text>
      <text x="24" y="166" fill="#475569" font-size="15">或退款率异常</text>
      <text x="24" y="194" fill="#475569" font-size="15">展示多场景</text>
      <rect x="24" y="244" width="166" height="54" rx="14" fill="#ffedd5"/>
      <text x="42" y="277" fill="#c2410c" font-size="16" font-weight="800">能覆盖业务</text>
    </g>

    <g transform="translate(1050 190)">
      <rect width="174" height="340" rx="24" fill="#ffffff" stroke="#fecaca"/>
      <rect x="20" y="24" width="76" height="36" rx="18" fill="#dc2626"/>
      <text x="40" y="48" fill="#ffffff" font-size="16" font-weight="850">2:40</text>
      <text x="24" y="98" fill="#0f172a" font-size="23" font-weight="850">安全拦截</text>
      <text x="24" y="138" fill="#475569" font-size="15">drop table</text>
      <text x="24" y="166" fill="#475569" font-size="15">guard 拒绝</text>
      <text x="24" y="194" fill="#475569" font-size="15">不执行 SQL</text>
      <rect x="24" y="244" width="126" height="54" rx="14" fill="#fee2e2"/>
      <text x="42" y="277" fill="#b91c1c" font-size="16" font-weight="800">可信落地</text>
    </g>
  </g>

  <rect x="214" y="602" width="852" height="60" rx="18" fill="#111827"/>
  <text x="252" y="640" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850">收束句：它不是普通 NL2SQL，而是可审计的数据分析值班工作流。</text>
</svg>
