[app]
name = DB Sentinel Agent
public_url = http://127.0.0.1:5173

[frontend]
host = 127.0.0.1
port = 5173
# 留空表示使用同源 /api；本地 Vite 开发会通过 vite.config.ts 代理到 backend。
# 如果前端静态资源和后端 API 分开部署，改成真实 API 地址，例如 https://api.example.com。
api_base_url =
runtime_config_path = public/runtime-config.js

[backend]
host = 127.0.0.1
port = 8000
cors_origins = http://127.0.0.1:5173,http://localhost:5173

[database]
path = backend/data/db_sentinel_demo.sqlite3
reset_enabled = false

[llm]
openai_base_url = https://api.openai.com/v1
openai_model =
